<!DOCTYPE html>
<html>
<head>
    <title>Layout</title> 
    <style>
        *{
            box-sizing: border-box;
        }
        header{
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: black;
            background-color: greenyellow;
        }nav{
            float: left;
            width: 30%;
            height: 300px;
            padding: 20px;
            background-color: yellow;
        }
        article{
            text-align: left;
            float: left;
            width: 70%;
            height: 300px;
            padding: 20px;
            background-color: red;
        }
        nav ul{
            list-style-type:decimal-leading-zero;
             padding: 0;
        }
        section::after {
            content: "";
            display: table;
            clear: both;
        }
        a{
            text-decoration: none;
            color: red;
        }
        footer{
            text-align: center;
            padding: 10px;
            background-color: pink;
        }
       @media (max-width: 600px) {
            nav, article {
             width: 100%;
            height: auto;
            }
        }
    </style>
</head>
<body>
    <header>HEADER</header>
    <section>

            </ul>
            
         </nav>

            <h5>นายระพีพัฒน์ หาญวงษ์</h5>
        </article>
        <br>
    </section>
    <footer>FOOTER</footer>
</body>
</html>
